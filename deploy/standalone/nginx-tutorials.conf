# nginx vhost for the standalone Tutorial Studio.
# The whole app (UI + /api/* + SSE) is one Next.js server on 127.0.0.1:3000.
# Install: /etc/nginx/sites-available/tutorials -> symlink to sites-enabled; then certbot.
#
#   sudo ln -s /etc/nginx/sites-available/tutorials /etc/nginx/sites-enabled/tutorials
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tutorials.schreinercontentsystems.com

server {
    listen 80;
    listen [::]:80;
    server_name tutorials.schreinercontentsystems.com;

    # Large screen-recording uploads (VA recordings can be hundreds of MB).
    client_max_body_size 2048m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/events) + WebSocket upgrade support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;         # required for Server-Sent Events
        proxy_read_timeout 3600s;    # long-lived SSE / big uploads
        proxy_send_timeout 3600s;
    }
}

# certbot rewrites the above to add the :443 TLS server block and an http->https
# redirect. Keep DNS-only (grey cloud) if fronted by Cloudflare so certbot's
# HTTP-01 challenge reaches the origin.
