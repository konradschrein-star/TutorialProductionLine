name: tutorial-recovery-test
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: tutorial_recovery_test
    ports:
      - "127.0.0.1:55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d tutorial_recovery_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56388:6379"
