server {
    server_name tutorials.schreinercontentsystems.com;

    client_max_body_size 2000M;
    client_body_timeout 300s;

    # Static Web App (Vite SPA)
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Backend API (Express & Batch Render Engine)
    location /api/ {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/tutorials.schreinercontentsystems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutorials.schreinercontentsystems.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name tutorials.schreinercontentsystems.com;
    return 301 https://$host$request_uri;
}
